<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1d1a" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#0e0f0c" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#040503" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="bar-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#65a30d" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg-glow)"/>

  <!-- Sleek typography lines -->
  <line x1="100" y1="360" x2="700" y2="360" stroke="#a3e635" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.3"/>
  <line x1="100" y1="440" x2="700" y2="440" stroke="#a3e635" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.3"/>

  <g transform="translate(150, 150)">
    <!-- Main Card Body -->
    <rect width="500" height="500" rx="24" fill="url(#bar-glow)" stroke="url(#border-glow)" stroke-width="1.5"/>
    
    <!-- Title -->
    <text x="50" y="80" font-family="'Inter', sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="-0.02em" opacity="0.9">
      TYPE SCALE
    </text>
    <text x="50" y="115" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#a3e635" letter-spacing="0.1em" opacity="0.8">
      EDITORIAL TYPOGRAPHY GRID
    </text>

    <!-- Typography Specs -->
    <g transform="translate(50, 180)">
      <!-- H1 Block -->
      <text x="0" y="40" font-family="'Cormorant Garamond', serif" font-size="52" font-weight="300" fill="#ffffff" opacity="0.95">Display Serif</text>
      <text x="0" y="70" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#a3e635" letter-spacing="0.1em">CORMORANT GARAMOND / 52PX / LIGHT</text>

      <!-- H2 Block -->
      <text x="0" y="150" font-family="'Inter', sans-serif" font-size="32" font-weight="800" fill="#ffffff" opacity="0.9" letter-spacing="-0.02em">Sans-Serif Bold</text>
      <text x="0" y="180" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#a3e635" letter-spacing="0.1em">INTER / 32PX / EXTRA BOLD</text>

      <!-- Mono Block -->
      <text x="0" y="240" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="400" fill="#e2e8f0" opacity="0.8">const font = 'Mono';</text>
      <text x="0" y="265" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#a3e635" letter-spacing="0.1em">JETBRAINS MONO / 16PX / REGULAR</text>
    </g>

    <!-- Outer geometric frame lines -->
    <path d="M 400,40 L 450,40 L 450,90" fill="none" stroke="#a3e635" stroke-width="1.5" opacity="0.5"/>
    <path d="M 450,410 L 450,450 L 410,450" fill="none" stroke="#a3e635" stroke-width="1.5" opacity="0.5"/>
  </g>
</svg>

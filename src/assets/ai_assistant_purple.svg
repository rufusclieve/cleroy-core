<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Deep Dark Purple Canvas -->
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#1e1b4b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#090514" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="bar-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#d946ef" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.6"/>
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg-glow)"/>

  <!-- Glowing Abstract Spheres for Depth -->
  <circle cx="400" cy="500" r="180" fill="#a78bfa" opacity="0.15" filter="url(#soft-glow)"/>
  <circle cx="280" cy="350" r="140" fill="#f472b6" opacity="0.08" filter="url(#soft-glow)"/>

  <!-- Centered Floating Title -->
  <text x="400" y="320" font-family="'Inter', system-ui, sans-serif" font-size="34" font-weight="400" fill="#ffffff" text-anchor="middle" letter-spacing="-0.02em" opacity="0.95">
    What’s on your mind today?
  </text>

  <!-- Prompt Search Pill -->
  <g transform="translate(100, 390)">
    <!-- Pill Background -->
    <rect width="600" height="76" rx="38" fill="url(#bar-glow)" stroke="url(#border-glow)" stroke-width="1.5"/>
    
    <!-- Plus Icon (Left) -->
    <g transform="translate(36, 38)" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.7">
      <line x1="-12" y1="0" x2="12" y2="0" />
      <line x1="0" y1="-12" x2="0" y2="12" />
    </g>

    <!-- Typing Cursor/Line -->
    <line x1="76" y1="26" x2="76" y2="50" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <animate attributeName="opacity" values="0.2;0.9;0.2" dur="1.2s" repeatCount="indefinite" />
    </line>

    <!-- Mic Icon (Right) -->
    <g transform="translate(544, 38)" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
      <rect x="-6" y="-12" width="12" height="18" rx="6" />
      <path d="M-10, -2 C-10, 6 10, 6 10, -2" />
      <line x1="0" y1="10" x2="0" y2="15" />
    </g>
  </g>
</svg>

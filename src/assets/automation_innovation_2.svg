<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#4c1d06" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#240c02" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0300" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="bar-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg-glow)"/>

  <!-- Rotating tech rings in background -->
  <circle cx="400" cy="400" r="280" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="30 20" opacity="0.12"/>
  <circle cx="400" cy="400" r="220" fill="none" stroke="#ea580c" stroke-width="1" stroke-dasharray="10 10" opacity="0.15"/>

  <g transform="translate(150, 150)">
    <!-- Main Card Body -->
    <rect width="500" height="500" rx="24" fill="url(#bar-glow)" stroke="url(#border-glow)" stroke-width="1.5"/>
    
    <!-- Title -->
    <text x="50" y="80" font-family="'Inter', sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="-0.02em" opacity="0.9">
      CENTRAL PIPELINE
    </text>
    <text x="50" y="115" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#ea580c" letter-spacing="0.1em" opacity="0.8">
      HIGH-SPEED TASK COMPILING
    </text>

    <!-- Glowing Tech Turbine / Concentric circles -->
    <g transform="translate(250, 300)">
      <circle cx="0" cy="0" r="110" fill="none" stroke="#ea580c" stroke-width="2" stroke-dasharray="20 15" opacity="0.5" filter="url(#glow)"/>
      <circle cx="0" cy="0" r="90" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.2"/>
      <circle cx="0" cy="0" r="70" fill="none" stroke="#ea580c" stroke-width="3" stroke-dasharray="40 10" opacity="0.6"/>
      <circle cx="0" cy="0" r="40" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="10 5" opacity="0.4"/>
      <circle cx="0" cy="0" r="15" fill="#ea580c" filter="url(#glow)"/>

      <!-- Spokes -->
      <g stroke="#ea580c" stroke-width="1.5" opacity="0.4">
        <line x1="0" y1="-110" x2="0" y2="-90" />
        <line x1="0" y1="90" x2="0" y2="110" />
        <line x1="-110" y1="0" x2="-90" y2="0" />
        <line x1="90" y1="0" x2="110" y2="0" />
        <line x1="-77" y1="-77" x2="-63" y2="-63" />
        <line x1="63" y1="63" x2="77" y2="77" />
        <line x1="63" y1="-63" x2="77" y2="-77" />
        <line x1="-77" y1="77" x2="-63" y2="63" />
      </g>
    </g>

    <!-- Side metadata columns -->
    <g transform="translate(50, 180)" opacity="0.8">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ea580c">SYSTEM ENGINE</text>
      <text x="0" y="24" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#ffffff">99.999% UP</text>

      <text x="0" y="70" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ea580c">COMPILING RATIO</text>
      <text x="0" y="94" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#ffffff">18,200/s</text>
    </g>
  </g>
</svg>

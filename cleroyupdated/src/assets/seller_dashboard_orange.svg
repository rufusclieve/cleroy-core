<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Dark slate backboard with soft orange corner highlight -->
    <radialGradient id="dash-bg" cx="15%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#24140e" />
      <stop offset="35%" stop-color="#121214" />
      <stop offset="100%" stop-color="#09090b" />
    </radialGradient>
    <linearGradient id="orange-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#ff7e40" />
    </linearGradient>
    <linearGradient id="orange-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0" />
    </linearGradient>
    <filter id="glow-effect" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" rx="16" fill="url(#dash-bg)"/>
  
  <!-- Subtle Orange Ambient Aura -->
  <circle cx="100" cy="180" r="220" fill="#ea580c" opacity="0.08" filter="url(#glow-effect)"/>

  <!-- Top Navigation Bar -->
  <g transform="translate(30, 25)" opacity="0.9">
    <!-- Brand Name (TrukOn) -->
    <circle cx="18" cy="22" r="10" fill="#ea580c" />
    <polygon points="14,22 18,16 22,22" fill="#ffffff" />
    <text x="36" y="28" font-family="'Inter', sans-serif" font-weight="700" font-size="20" fill="#ffffff" letter-spacing="-0.02em">Trukon</text>
    
    <!-- Pills -->
    <g transform="translate(420, 10)" font-family="'Inter', sans-serif" font-size="12" font-weight="500">
      <rect x="0" y="-12" width="60" height="24" rx="12" fill="#ea580c" fill-opacity="0.15"/>
      <text x="30" y="4" fill="#ff9f55" text-anchor="middle">Orders</text>
      
      <text x="110" y="4" fill="#a1a1aa" text-anchor="middle">Shipments</text>
      <text x="200" y="4" fill="#a1a1aa" text-anchor="middle">Transactions</text>
      <text x="280" y="4" fill="#a1a1aa" text-anchor="middle">Settings</text>
    </g>
  </g>

  <!-- Title -->
  <text x="30" y="105" font-family="'Inter', sans-serif" font-weight="600" font-size="26" fill="#ffffff" letter-spacing="-0.03em" opacity="0.95">Seller Dashboard</text>

  <!-- Main Card Left: Shipment Success Stats -->
  <g transform="translate(30, 130)">
    <!-- Box container with subtle backplane -->
    <rect width="420" height="225" rx="12" fill="#18181c" stroke="#27272a" stroke-width="1" />
    <rect width="420" height="225" rx="12" fill="url(#orange-glow)" opacity="0.3" />
    
    <text x="25" y="35" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#a1a1aa" letter-spacing="0.02em">SHIPMENT SUCCESS</text>
    
    <!-- Big Revenue -->
    <text x="25" y="105" font-family="'Inter', sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="-0.03em">+$2,456.00</text>
    <text x="25" y="125" font-family="'Inter', sans-serif" font-size="11" font-weight="400" fill="#71717a">Shipment Revenue this month</text>
    
    <!-- Progress Indicator -->
    <g transform="translate(25, 155)">
      <rect width="370" height="45" rx="22" fill="#241c18" stroke="#3c261c" stroke-width="1" />
      <!-- Animated / Filled bar -->
      <rect width="314" height="43" x="1" y="1" rx="21" fill="url(#orange-bar)" />
      
      <!-- Percentage Text -->
      <text x="350" y="27" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">85%</text>
    </g>
  </g>

  <!-- Side Card Right: Tracking History Map Card -->
  <g transform="translate(470, 130)">
    <rect width="300" height="225" rx="12" fill="#18181c" stroke="#27272a" stroke-width="1" />
    
    <text x="20" y="30" font-family="'Inter', sans-serif" font-size="13" font-weight="500" fill="#a1a1aa" letter-spacing="0.02em">Tracking History</text>
    
    <!-- Mini Map Grid -->
    <g transform="translate(20, 50)">
      <rect width="260" height="110" rx="8" fill="#121214" />
      <!-- Map เส้นทาง (Path Curve) -->
      <path d="M 20,80 Q 80,40 140,70 T 240,40" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" filter="url(#glow-effect)" opacity="0.8" />
      <circle cx="20" cy="80" r="5" fill="#ea580c" />
      <circle cx="240" cy="40" r="5" fill="#ffffff" stroke="#ea580c" stroke-width="2" />
      
      <text x="240" y="25" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#ff9f55" text-anchor="middle">Transit</text>
    </g>
    
    <text x="20" y="195" font-family="'Inter', sans-serif" font-size="11" fill="#71717a">Tracking ID: E-FKRH99796HJ</text>
  </g>

  <!-- Bottom Panel: Recent Orders & Driver Profile -->
  <g transform="translate(30, 375)">
    <!-- Recent Order Table -->
    <g transform="translate(0, 0)">
      <rect width="420" height="195" rx="12" fill="#18181c" stroke="#27272a" stroke-width="1" />
      <text x="25" y="30" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#ffffff">Recent Orders</text>
      
      <!-- Table Header -->
      <text x="25" y="65" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#71717a">ORDER ID</text>
      <text x="140" y="65" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#71717a">COMPANY</text>
      <text x="280" y="65" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#71717a">STATUS</text>
      <text x="360" y="65" font-family="'Inter', sans-serif" font-size="10" font-weight="500" fill="#71717a">WEIGHT</text>
      
      <line x1="25" y1="75" x2="395" y2="75" stroke="#27272a" />
      
      <!-- Row 1 -->
      <text x="25" y="105" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ffffff">ORD-1562</text>
      <text x="140" y="105" font-family="'Inter', sans-serif" font-size="11" fill="#a1a1aa">Alpha Ent.</text>
      <rect x="275" y="94" width="48" height="16" rx="8" fill="#ea580c" fill-opacity="0.15" />
      <text x="299" y="106" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#ff9f55" text-anchor="middle">Transit</text>
      <text x="360" y="105" font-family="'Inter', sans-serif" font-size="11" fill="#a1a1aa">52kg</text>

      <!-- Row 2 -->
      <text x="25" y="145" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#ffffff">ORD-1563</text>
      <text x="140" y="145" font-family="'Inter', sans-serif" font-size="11" fill="#a1a1aa">Soybean Co.</text>
      <rect x="275" y="134" width="48" height="16" rx="8" fill="#10b981" fill-opacity="0.15" />
      <text x="299" y="146" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#34d399" text-anchor="middle">Delivered</text>
      <text x="360" y="145" font-family="'Inter', sans-serif" font-size="11" fill="#a1a1aa">120kg</text>
    </g>

    <!-- Driver Card Profile -->
    <g transform="translate(440, 0)">
      <rect width="300" height="195" rx="12" fill="#18181c" stroke="#27272a" stroke-width="1" />
      
      <!-- Avatar Silhouette -->
      <circle cx="65" cy="70" r="35" fill="#ea580c" fill-opacity="0.2" />
      <!-- Drawing a beautiful stylized vector head/person outline -->
      <circle cx="65" cy="62" r="14" fill="#ff9f55" />
      <path d="M 42,92 Q 65,74 88,92" fill="#ff9f55" />

      <g transform="translate(120, 55)">
        <text x="0" y="0" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#ffffff">Edwards</text>
        <text x="0" y="16" font-family="'Inter', sans-serif" font-size="11" fill="#71717a">Delivery Driver</text>
        
        <g transform="translate(0, 38)">
          <text x="0" y="0" font-family="'Inter', sans-serif" font-size="11" fill="#e4e4e7">Rating: <tspan fill="#ff9f55" font-weight="bold">★ 4.9</tspan></text>
        </g>
      </g>

      <!-- Pill Action -->
      <g transform="translate(25, 135)">
        <rect width="250" height="38" rx="19" fill="#241c18" stroke="#ea580c" stroke-width="1" stroke-opacity="0.5" />
        <text x="125" y="24" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#ff9f55" text-anchor="middle">Receive a Call</text>
      </g>
    </g>
  </g>
</svg>

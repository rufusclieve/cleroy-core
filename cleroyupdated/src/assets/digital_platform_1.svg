<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d1b2a" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#011627" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#010c15" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="bar-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg-glow)"/>

  <!-- Tech Grid Background -->
  <g opacity="0.1">
    <path d="M 50,0 L 50,800 M 150,0 L 150,800 M 250,0 L 250,800 M 350,0 L 350,800 M 450,0 L 450,800 M 550,0 L 550,800 M 650,0 L 650,800 M 750,0 L 750,800" stroke="#00f2fe" stroke-width="1"/>
    <path d="M 0,50 L 800,50 M 0,150 L 800,150 M 0,250 L 800,250 M 0,350 L 800,350 M 0,450 L 800,450 M 0,550 L 800,550 M 0,650 L 800,650 M 0,750 L 800,750" stroke="#00f2fe" stroke-width="1"/>
  </g>

  <!-- Glowing Core -->
  <circle cx="400" cy="400" r="160" fill="#00f2fe" opacity="0.05" filter="url(#glow)"/>
  <circle cx="400" cy="400" r="100" fill="none" stroke="url(#border-glow)" stroke-width="2" stroke-dasharray="8 6"/>

  <g transform="translate(150, 150)">
    <!-- Main Card Body -->
    <rect width="500" height="500" rx="24" fill="url(#bar-glow)" stroke="url(#border-glow)" stroke-width="2"/>
    
    <!-- Title Text -->
    <text x="50" y="80" font-family="'Inter', sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="-0.02em" opacity="0.9">
      PLATFORM ARCHITECTURE
    </text>
    <text x="50" y="115" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#00f2fe" letter-spacing="0.1em" opacity="0.8">
      ENTERPRISE CONTROL UNIT
    </text>

    <!-- Graphical Blocks -->
    <g transform="translate(50, 160)" opacity="0.85">
      <!-- Node Row 1 -->
      <rect x="0" y="0" width="180" height="90" rx="12" fill="#011627" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.4"/>
      <text x="25" y="40" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#8899a6">LOAD BALANCER</text>
      <text x="25" y="65" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#ffffff">99.98% OK</text>
      <circle cx="155" cy="50" r="6" fill="#00f2fe" filter="url(#glow)"/>

      <rect x="210" y="0" width="180" height="90" rx="12" fill="#011627" stroke="#4facfe" stroke-width="1.5" stroke-opacity="0.4"/>
      <text x="235" y="40" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#8899a6">CLOUD DATABASE</text>
      <text x="235" y="65" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#ffffff">0.8 ms LATENCY</text>
      <circle cx="365" cy="50" r="6" fill="#4facfe" filter="url(#glow)"/>

      <!-- Node Row 2 -->
      <rect x="0" y="120" width="390" height="150" rx="12" fill="#011627" stroke="url(#border-glow)" stroke-width="1.5"/>
      <text x="25" y="40" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#8899a6">ACTIVE INSTANCE THROUGHPUT</text>
      
      <!-- Mini Chart -->
      <path d="M 30,220 L 80,180 L 130,200 L 180,150 L 230,190 L 280,140 L 330,170" fill="none" stroke="#00f2fe" stroke-width="3" filter="url(#glow)"/>
      <circle cx="330" cy="170" r="5" fill="#00f2fe"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Clean minimalist off-white architectural background -->
  <rect width="100%" height="100%" fill="#f4f4f6" />
  
  <!-- Subtle warm architectural paper texture effect -->
  <rect width="100%" height="100%" fill="rgba(212, 90, 18, 0.005)" />

  <!-- Grid lines overlay (representing blueprints) -->
  <line x1="60" y1="0" x2="60" y2="600" stroke="rgba(0, 0, 0, 0.02)" stroke-width="1" />
  <line x1="740" y1="0" x2="740" y2="600" stroke="rgba(0, 0, 0, 0.02)" stroke-width="1" />
  <line x1="0" y1="80" x2="800" y2="80" stroke="rgba(0, 0, 0, 0.02)" stroke-width="1" />

  <!-- HEADER -->
  <!-- Logo Left -->
  <g transform="translate(60, 45)">
    <text x="0" y="0" font-family="sans-serif" font-weight="900" font-size="16" fill="#111111" letter-spacing="1">HI-RISE</text>
    <text x="0" y="12" font-family="sans-serif" font-weight="500" font-size="7" fill="#666666" letter-spacing="0.5">BUILDERS &amp; DEVELOPERS</text>
  </g>

  <!-- Navigation items right -->
  <g transform="translate(420, 45)" font-family="sans-serif" font-weight="bold" font-size="10" fill="#444444" letter-spacing="1">
    <text x="0" y="0">PROJECT</text>
    <text x="80" y="0">PROCESS</text>
    <text x="160" y="0">ABOUT</text>
    <text x="230" y="0">CONTACT</text>
  </g>

  <!-- Hamburger Menu Icon -->
  <g transform="translate(715, 38)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#111111" stroke-width="2.2" />
    <line x1="0" y1="7" x2="25" y2="7" stroke="#111111" stroke-width="2.2" />
    <line x1="0" y1="14" x2="25" y2="14" stroke="#111111" stroke-width="2.2" />
  </g>

  <!-- Left social media indicators -->
  <g transform="translate(60, 180)" font-family="sans-serif" font-size="10" font-weight="bold" fill="#888888" letter-spacing="1">
    <text x="0" y="0" transform="rotate(90)" transform-origin="0 0">INSTAGRAM</text>
    <text x="0" y="90" transform="rotate(90)" transform-origin="0 0">BEHANCE</text>
    <text x="0" y="160" transform="rotate(90)" transform-origin="0 0">LINKEDIN</text>
  </g>

  <!-- Vertical timeline layout accent line -->
  <line x1="68" y1="360" x2="68" y2="520" stroke="#111111" stroke-width="1.5" />

  <!-- MAIN STATEMENT HEADLINE -->
  <g transform="translate(130, 190)">
    <text x="0" y="0" font-family="sans-serif" font-weight="800" font-size="44" fill="#111111" letter-spacing="-1.5">Building your visions,</text>
    <text x="0" y="55" font-family="sans-serif" font-weight="800" font-size="44" fill="#111111" letter-spacing="-1.5">Creating reality.</text>
  </g>

  <!-- GIANT CURVED ARCHITECTURAL STRUCTURE (Bottom center-right) -->
  <!-- A beautiful 3D curved parametric grid structure facade -->
  <g transform="translate(260, 270)">
    <!-- Base dark background of the building -->
    <path d="M 0 330 C 100 130 360 80 480 330 Z" fill="#222224" />
    
    <!-- Pattern of curved window-like grids (curved facade) -->
    <!-- Vertical columns curve outward and lean -->
    <path d="M 0 330 C 60 170 160 120 180 330" fill="none" stroke="#f4f4f6" stroke-width="2.5" />
    <path d="M 0 330 C 100 160 220 110 280 330" fill="none" stroke="#f4f4f6" stroke-width="2.5" />
    <path d="M 0 330 C 140 150 280 110 380 330" fill="none" stroke="#f4f4f6" stroke-width="2.5" />
    <path d="M 100 330 C 180 150 320 110 440 330" fill="none" stroke="#f4f4f6" stroke-width="2.5" />
    <path d="M 180 330 C 240 160 360 120 480 330" fill="none" stroke="#f4f4f6" stroke-width="2.5" />
    <path d="M 280 330 C 330 170 410 130 480 330" fill="none" stroke="#f4f4f6" stroke-width="2.5" />
    <path d="M 380 330 C 410 180 450 150 480 330" fill="none" stroke="#f4f4f6" stroke-width="2.5" />

    <!-- Horizontal curves slicing through the columns -->
    <path d="M 40 280 C 120 150 300 110 440 280" fill="none" stroke="#f4f4f6" stroke-width="1.8" />
    <path d="M 80 230 C 150 140 280 110 400 230" fill="none" stroke="#f4f4f6" stroke-width="1.8" />
    <path d="M 120 180 C 180 125 260 110 360 180" fill="none" stroke="#f4f4f6" stroke-width="1.8" />
    <path d="M 160 140 C 200 110 240 100 320 140" fill="none" stroke="#f4f4f6" stroke-width="1.8" />
    <path d="M 0 310 C 100 240 360 190 480 310" fill="none" stroke="#f4f4f6" stroke-width="2" />
    <path d="M 0 290 C 100 200 360 150 480 290" fill="none" stroke="#f4f4f6" stroke-width="2.2" />

    <!-- Additional architectural diagonal wireframe lines to show incredible technical detail -->
    <path d="M 10 320 L 50 250" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <path d="M 50 300 L 95 235" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <path d="M 100 285 L 145 220" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <path d="M 150 270 L 195 205" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <path d="M 200 260 L 255 190" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <path d="M 260 250 L 315 180" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <path d="M 320 245 L 375 185" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <path d="M 380 250 L 435 190" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <path d="M 430 260 L 475 200" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
  </g>

  <!-- Architectural scale rule / technical marker in bottom left -->
  <g transform="translate(130, 530)" font-family="monospace" font-size="9" fill="#999999">
    <line x1="0" y1="0" x2="100" y2="0" stroke="#999999" stroke-width="1" />
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#999999" stroke-width="1" />
    <line x1="25" y1="-2" x2="25" y2="2" stroke="#999999" stroke-width="0.5" />
    <line x1="50" y1="-3" x2="50" y2="3" stroke="#999999" stroke-width="1" />
    <line x1="75" y1="-2" x2="75" y2="2" stroke="#999999" stroke-width="0.5" />
    <line x1="100" y1="-3" x2="100" y2="3" stroke="#999999" stroke-width="1" />
    <text x="0" y="14" text-anchor="middle">0M</text>
    <text x="50" y="14" text-anchor="middle">10M</text>
    <text x="100" y="14" text-anchor="middle">20M</text>
  </g>

  <!-- Page number marker bottom right -->
  <text x="740" y="540" font-family="sans-serif" font-weight="900" font-size="12" fill="#111111" text-anchor="end" letter-spacing="1">PAGE_01 // ARCHIVE</text>
</svg>

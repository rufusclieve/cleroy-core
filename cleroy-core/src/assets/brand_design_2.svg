<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#221e1d" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#120f0e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#070605" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="bar-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg-glow)"/>

  <!-- Soft Pink/Red background shapes -->
  <circle cx="200" cy="500" r="150" fill="#f43f5e" opacity="0.08" filter="url(#glow)"/>
  <circle cx="580" cy="300" r="180" fill="#fb7185" opacity="0.05" filter="url(#glow)"/>

  <g transform="translate(150, 150)">
    <!-- Main Card Body -->
    <rect width="500" height="500" rx="24" fill="url(#bar-glow)" stroke="url(#border-glow)" stroke-width="1.5"/>
    
    <!-- Title -->
    <text x="50" y="80" font-family="'Inter', sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="-0.02em" opacity="0.9">
      VISUAL SYSTEMS
    </text>
    <text x="50" y="115" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#f43f5e" letter-spacing="0.1em" opacity="0.8">
      COLOR CHROMATIC MATRIX
    </text>

    <!-- Swatch 1 -->
    <g transform="translate(50, 180)">
      <!-- Swatch shape -->
      <rect width="110" height="240" rx="16" fill="#f43f5e" opacity="0.9"/>
      <rect x="0" y="150" width="110" height="90" rx="0" fill="#ffffff" opacity="0.1"/>
      <text x="55" y="195" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">ROSE</text>
      <text x="55" y="218" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#ffffff" text-anchor="middle" opacity="0.8">#F43F5E</text>
    </g>

    <!-- Swatch 2 -->
    <g transform="translate(195, 180)">
      <rect width="110" height="240" rx="16" fill="#fda4af" opacity="0.9"/>
      <rect x="0" y="150" width="110" height="90" rx="0" fill="#000000" opacity="0.1"/>
      <text x="55" y="195" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#1e293b" text-anchor="middle">BLUSH</text>
      <text x="55" y="218" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#1e293b" text-anchor="middle" opacity="0.8">#FDA4AF</text>
    </g>

    <!-- Swatch 3 -->
    <g transform="translate(340, 180)">
      <rect width="110" height="240" rx="16" fill="#9f1239" opacity="0.9"/>
      <rect x="0" y="150" width="110" height="90" rx="0" fill="#ffffff" opacity="0.1"/>
      <text x="55" y="195" font-family="'Inter', sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">CRIMSON</text>
      <text x="55" y="218" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#ffffff" text-anchor="middle" opacity="0.8">#9F1239</text>
    </g>

    <!-- Details overlay -->
    <text x="50" y="460" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#8899a6" letter-spacing="0.05em">Aesthetic balance calculated across RGB space</text>
  </g>
</svg>

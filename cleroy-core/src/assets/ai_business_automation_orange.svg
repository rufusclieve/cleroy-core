<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="100%" height="100%">
  <defs>
    <!-- Deep glowing dark amber radial background -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#3c1e04" />
      <stop offset="40%" stop-color="#140801" />
      <stop offset="100%" stop-color="#050200" />
    </radialGradient>
    
    <!-- Linear Laser Columns -->
    <linearGradient id="laser-col" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0" />
      <stop offset="30%" stop-color="#ff7e40" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#ff7e40" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0" />
    </linearGradient>

    <!-- Block Glow Gradient -->
    <linearGradient id="block-fill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="block-stroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9f55" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.3" />
    </linearGradient>

    <!-- Button Gradient -->
    <linearGradient id="btn-fill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <filter id="laser-blur" x="-50%" y="-10%" width="200%" height="120%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="block-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#ea580c" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#bg-glow)" />

  <!-- Background Laser Beams -->
  <rect x="385" y="0" width="30" height="1000" fill="url(#laser-col)" filter="url(#laser-blur)" />
  <rect x="396" y="0" width="8" height="1000" fill="#ffffff" opacity="0.6" filter="url(#laser-blur)" />

  <!-- Header Brand (INOVV) -->
  <g transform="translate(40, 50)" opacity="0.85">
    <!-- INOVV Icon -->
    <polygon points="10,12 25,2 40,12 25,22" fill="none" stroke="#ffffff" stroke-width="2.5" />
    <polyline points="15,12 25,7 35,12" fill="none" stroke="#ff7e40" stroke-width="2" />
    <text x="52" y="18" font-family="'Inter', sans-serif" font-weight="800" font-size="16" fill="#ffffff" letter-spacing="0.1em">INOVV</text>
    <text x="650" y="18" font-family="'Inter', sans-serif" font-size="11" fill="#ffffff" letter-spacing="0.2em" opacity="0.8">INOVV.CO</text>
  </g>

  <!-- Centered 3 Premium Glass Cards -->
  <!-- 1. Center Top Card: 20% Aumento da Receita -->
  <g transform="translate(290, 210)" filter="url(#block-shadow)">
    <rect width="220" height="220" rx="24" fill="url(#block-fill)" stroke="url(#block-stroke)" stroke-width="1.5" />
    <text x="110" y="85" font-family="'Inter', sans-serif" font-weight="700" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="-0.02em">20%</text>
    <text x="110" y="135" font-family="'Inter', sans-serif" font-size="14" fill="#ffaa66" text-anchor="middle" font-weight="500">no Aumento</text>
    <text x="110" y="155" font-family="'Inter', sans-serif" font-size="14" fill="#ffaa66" text-anchor="middle" font-weight="500">da Receita</text>
  </g>

  <!-- 2. Left Card: 50% Redução de Custos -->
  <g transform="translate(130, 370)" filter="url(#block-shadow)">
    <rect width="220" height="220" rx="24" fill="url(#block-fill)" stroke="url(#block-stroke)" stroke-width="1.5" />
    <text x="110" y="85" font-family="'Inter', sans-serif" font-weight="700" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="-0.02em">50%</text>
    <text x="110" y="135" font-family="'Inter', sans-serif" font-size="14" fill="#ffaa66" text-anchor="middle" font-weight="500">na Redução</text>
    <text x="110" y="155" font-family="'Inter', sans-serif" font-size="14" fill="#ffaa66" text-anchor="middle" font-weight="500">de Custos</text>
  </g>

  <!-- 3. Right Card: 99.2% Eficiência Operacional -->
  <g transform="translate(450, 370)" filter="url(#block-shadow)">
    <rect width="220" height="220" rx="24" fill="url(#block-fill)" stroke="url(#block-stroke)" stroke-width="1.5" />
    <text x="110" y="85" font-family="'Inter', sans-serif" font-weight="700" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="-0.02em">99,2%</text>
    <text x="110" y="135" font-family="'Inter', sans-serif" font-size="14" fill="#ffaa66" text-anchor="middle" font-weight="500">de Eficiência</text>
    <text x="110" y="155" font-family="'Inter', sans-serif" font-size="14" fill="#ffaa66" text-anchor="middle" font-weight="500">Operacional</text>
  </g>

  <!-- Subtitle Text -->
  <text x="400" y="700" font-family="'Inter', sans-serif" font-weight="300" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="-0.01em">
    Descubra como Aplicar <tspan font-weight="700">IA</tspan>
  </text>
  <text x="400" y="745" font-family="'Inter', sans-serif" font-weight="300" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="-0.01em">
    de verdade no seu negócio
  </text>

  <!-- Call To Action Button (Pill Button) -->
  <g transform="translate(200, 810)" filter="url(#block-shadow)">
    <rect width="400" height="70" rx="35" fill="url(#btn-fill)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.5" />
    <text x="200" y="42" font-family="'Inter', sans-serif" font-weight="700" font-size="17" fill="#ffffff" text-anchor="middle" letter-spacing="0.05em">
      Fale com um Especialista em IA
    </text>
    <!-- Arrow -->
    <path d="M 335,35 L 347,35 M 347,35 L 342,30 M 347,35 L 342,40" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>

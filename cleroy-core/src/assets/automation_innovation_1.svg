<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#3b1d11" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#1c0a03" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0300" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="bar-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg-glow)"/>

  <!-- Circuit traces -->
  <g stroke="#ea580c" stroke-width="1.5" opacity="0.25" fill="none" stroke-linejoin="round">
    <path d="M 100,200 L 300,200 L 400,300 L 400,600 L 500,700" />
    <path d="M 700,200 L 500,200 L 400,300" />
    <path d="M 200,600 L 300,500 L 500,500 L 600,600" />
    <circle cx="100" cy="200" r="4" fill="#ea580c"/>
    <circle cx="700" cy="200" r="4" fill="#ea580c"/>
    <circle cx="500" cy="700" r="4" fill="#f97316"/>
  </g>

  <g transform="translate(150, 150)">
    <!-- Main Card Body -->
    <rect width="500" height="500" rx="24" fill="url(#bar-glow)" stroke="url(#border-glow)" stroke-width="1.5"/>
    
    <!-- Title -->
    <text x="50" y="80" font-family="'Inter', sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="-0.02em" opacity="0.9">
      AUTONOMOUS FLOW
    </text>
    <text x="50" y="115" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#ea580c" letter-spacing="0.1em" opacity="0.8">
      LOGIC AUTOMATION LAYER
    </text>

    <!-- Flowchart Representation inside Card -->
    <g transform="translate(50, 180)">
      <!-- Box 1 -->
      <rect x="110" y="0" width="180" height="55" rx="10" fill="#1e293b" stroke="#ea580c" stroke-width="1.5"/>
      <text x="200" y="32" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">TRIGGER EVENT</text>
      
      <!-- Arrow 1 -->
      <path d="M 200,55 L 200,105" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="4 2"/>
      
      <!-- Box 2 -->
      <rect x="70" y="105" width="260" height="70" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="1.5"/>
      <text x="200" y="135" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">INTELLIGENT ROUTER</text>
      <text x="200" y="155" font-family="'Inter', sans-serif" font-size="11" font-weight="500" fill="#94a3b8" text-anchor="middle">AI ANALYZING CLASSIFICATION</text>

      <!-- Arrow 2 & 3 branching -->
      <path d="M 120,175 L 120,230 L 70,230" fill="none" stroke="#ea580c" stroke-width="1.5"/>
      <path d="M 280,175 L 280,230 L 330,230" fill="none" stroke="#ea580c" stroke-width="1.5"/>

      <!-- Branch Boxes -->
      <rect x="10" y="235" width="110" height="45" rx="8" fill="#0f172a" stroke="#ea580c" stroke-width="1"/>
      <text x="65" y="262" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">CRM SYNC</text>

      <rect x="280" y="235" width="110" height="45" rx="8" fill="#0f172a" stroke="#ea580c" stroke-width="1"/>
      <text x="335" y="262" font-family="'Inter', sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">NOTIFY SLACK</text>
    </g>
  </g>
</svg>

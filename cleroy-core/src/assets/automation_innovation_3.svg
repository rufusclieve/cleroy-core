<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#4c1204" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#240701" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0100" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="bar-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#c2410c" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg-glow)"/>

  <!-- Cybernetic wave lines -->
  <path d="M -100,450 Q 200,350 400,450 T 900,450" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.3" filter="url(#glow)"/>
  <path d="M -100,480 Q 200,380 400,480 T 900,480" fill="none" stroke="#ea580c" stroke-width="1" opacity="0.2"/>

  <g transform="translate(150, 150)">
    <!-- Main Card Body -->
    <rect width="500" height="500" rx="24" fill="url(#bar-glow)" stroke="url(#border-glow)" stroke-width="1.5"/>
    
    <!-- Title -->
    <text x="50" y="80" font-family="'Inter', sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="-0.02em" opacity="0.9">
      CONTINUOUS PIPELINE
    </text>
    <text x="50" y="115" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#f97316" letter-spacing="0.1em" opacity="0.8">
      DATA FLOW TRANSFORMATION
    </text>

    <!-- Wave Graphic Inside Card -->
    <g transform="translate(50, 180)">
      <rect width="400" height="240" rx="16" fill="#0c0200" stroke="#f97316" stroke-width="1" stroke-opacity="0.2"/>
      
      <!-- Wave paths -->
      <path d="M 30,120 C 100,40 200,200 300,120 S 370,120 370,120" fill="none" stroke="#f97316" stroke-width="3" filter="url(#glow)"/>
      <path d="M 30,140 C 100,60 200,220 300,140 S 370,140 370,140" fill="none" stroke="#ea580c" stroke-width="1.5" opacity="0.6"/>
      
      <!-- Tiny pulsing points -->
      <circle cx="165" cy="120" r="5" fill="#ffffff" filter="url(#glow)"/>
      <circle cx="265" cy="140" r="5" fill="#f97316" filter="url(#glow)"/>
    </g>

    <!-- Stats overlay text -->
    <text x="50" y="460" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#8899a6" letter-spacing="0.05em">Automated triggers compiled with 0ms latency drop</text>
  </g>
</svg>

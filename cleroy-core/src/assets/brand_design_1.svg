<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a1e12" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#140e0a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#080504" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="bar-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg-glow)"/>

  <!-- Elegant Golden curves -->
  <path d="M -100,500 C 200,600 400,200 900,400" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.15"/>
  <path d="M -100,520 C 220,620 380,180 900,420" fill="none" stroke="#fbbf24" stroke-width="0.5" opacity="0.1"/>

  <g transform="translate(150, 150)">
    <!-- Main Card Body -->
    <rect width="500" height="500" rx="24" fill="url(#bar-glow)" stroke="url(#border-glow)" stroke-width="1.5"/>
    
    <!-- Large elegant serif letter Specimen -->
    <text x="360" y="320" font-family="'Cormorant Garamond', 'Playfair Display', serif" font-size="280" font-weight="300" font-style="italic" fill="#fbbf24" opacity="0.25" filter="url(#glow)">C</text>
    <text x="360" y="320" font-family="'Cormorant Garamond', 'Playfair Display', serif" font-size="280" font-weight="300" font-style="italic" fill="#ffffff" opacity="0.15">C</text>

    <!-- Editorial Header Info -->
    <text x="50" y="80" font-family="'Inter', sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="-0.02em" opacity="0.9">
      BRAND IDENTITY
    </text>
    <text x="50" y="115" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#fbbf24" letter-spacing="0.1em" opacity="0.8">
      EDITORIAL &amp; LUXURY CODING
    </text>

    <!-- Mini Columns layout -->
    <g transform="translate(50, 180)">
      <!-- Line separator -->
      <line x1="0" y1="0" x2="240" y2="0" stroke="#fbbf24" stroke-width="1" opacity="0.3"/>
      
      <text x="0" y="35" font-family="'Cormorant Garamond', serif" font-size="36" font-style="italic" font-weight="400" fill="#ffffff" opacity="0.9">Crafted to inspire.</text>
      
      <text x="0" y="85" font-family="'Inter', sans-serif" font-size="13" font-weight="300" fill="#d1d5db" opacity="0.7" letter-spacing="0.02em">
        Visual systems that bridge the gap
      </text>
      <text x="0" y="105" font-family="'Inter', sans-serif" font-size="13" font-weight="300" fill="#d1d5db" opacity="0.7" letter-spacing="0.02em">
        between technical precision and
      </text>
      <text x="0" y="125" font-family="'Inter', sans-serif" font-size="13" font-weight="300" fill="#d1d5db" opacity="0.7" letter-spacing="0.02em">
        luxurious, high-end design.
      </text>

      <!-- Geometry outline -->
      <g transform="translate(0, 170)">
        <rect x="0" y="0" width="80" height="80" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.4"/>
        <circle cx="40" cy="40" r="40" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.3"/>
        <line x1="0" y1="0" x2="80" y2="80" stroke="#fbbf24" stroke-width="1" opacity="0.3"/>
        <text x="95" y="30" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#fbbf24" letter-spacing="0.1em">GOLDEN RATIO</text>
        <text x="95" y="52" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#ffffff">φ = 1.618</text>
      </g>
    </g>
  </g>
</svg>

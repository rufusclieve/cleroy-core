<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#051e2e" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#020e17" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#000508" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="bar-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg-glow)"/>

  <!-- Background Radar Circles -->
  <circle cx="400" cy="400" r="300" fill="none" stroke="#14b8a6" stroke-width="0.5" opacity="0.1"/>
  <circle cx="400" cy="400" r="200" fill="none" stroke="#14b8a6" stroke-width="0.5" opacity="0.15"/>
  <circle cx="400" cy="400" r="100" fill="none" stroke="#14b8a6" stroke-width="0.5" opacity="0.2"/>

  <g transform="translate(150, 150)">
    <!-- Main Card Body -->
    <rect width="500" height="500" rx="24" fill="url(#bar-glow)" stroke="url(#border-glow)" stroke-width="2"/>
    
    <!-- Header -->
    <text x="50" y="80" font-family="'Inter', sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="-0.02em" opacity="0.9">
      ANALYTIC INSIGHTS
    </text>
    <text x="50" y="115" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#14b8a6" letter-spacing="0.1em" opacity="0.8">
      REAL-TIME DATA STREAM
    </text>

    <!-- Circular Progress Indicator & Metrics -->
    <g transform="translate(50, 160)">
      <!-- Radial Ring -->
      <circle cx="100" cy="120" r="70" fill="none" stroke="#111827" stroke-width="12"/>
      <circle cx="100" cy="120" r="70" fill="none" stroke="#14b8a6" stroke-width="12" stroke-dasharray="440" stroke-dashoffset="110" stroke-linecap="round" filter="url(#glow)"/>
      <text x="100" y="128" font-family="'Inter', sans-serif" font-size="24" font-weight="800" fill="#ffffff" text-anchor="middle">75%</text>
      <text x="100" y="215" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#8899a6" text-anchor="middle">COMPUTATION CPU</text>

      <!-- Grid layout metrics -->
      <g transform="translate(230, 40)">
        <text x="0" y="0" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#8899a6">DATA PIPELINES</text>
        <text x="0" y="28" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#ffffff">342 Active</text>

        <text x="0" y="90" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#8899a6">BANDWIDTH VELOCITY</text>
        <text x="0" y="118" font-family="'Inter', sans-serif" font-size="28" font-weight="800" fill="#0ea5e9">4.8 GB/s</text>
      </g>
    </g>

    <!-- Bottom Status Pill -->
    <rect x="50" y="400" width="400" height="50" rx="12" fill="#022c22" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.3"/>
    <circle cx="80" cy="425" r="5" fill="#14b8a6" filter="url(#glow)"/>
    <text x="105" y="429" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" letter-spacing="0.05em">SYSTEM INTEGRITY SECURE • ALL CHANNELS OPERATIONAL</text>
  </g>
</svg>

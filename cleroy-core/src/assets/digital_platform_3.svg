<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>
    <linearGradient id="bar-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="border-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#bg-glow)"/>

  <!-- Connecting Nodes Map Pattern in Background -->
  <g opacity="0.15" stroke="#6366f1" stroke-width="1">
    <line x1="200" y1="200" x2="400" y2="300" />
    <line x1="400" y1="300" x2="600" y2="150" />
    <line x1="400" y1="300" x2="300" y2="550" />
    <line x1="300" y1="550" x2="550" y2="600" />
    <line x1="550" y1="600" x2="600" y2="400" />
    <circle cx="200" cy="200" r="4" fill="#6366f1"/>
    <circle cx="400" cy="300" r="6" fill="#3b82f6"/>
    <circle cx="600" cy="150" r="4" fill="#6366f1"/>
    <circle cx="300" cy="550" r="5" fill="#3b82f6"/>
    <circle cx="550" cy="600" r="4" fill="#6366f1"/>
    <circle cx="600" cy="400" r="5" fill="#6366f1"/>
  </g>

  <g transform="translate(150, 150)">
    <!-- Main Card Body -->
    <rect width="500" height="500" rx="24" fill="url(#bar-glow)" stroke="url(#border-glow)" stroke-width="2"/>
    
    <!-- Title -->
    <text x="50" y="80" font-family="'Inter', sans-serif" font-size="28" font-weight="700" fill="#ffffff" letter-spacing="-0.02em" opacity="0.9">
      GLOBAL DISTRIBUTION
    </text>
    <text x="50" y="115" font-family="'Inter', sans-serif" font-size="14" font-weight="500" fill="#6366f1" letter-spacing="0.1em" opacity="0.8">
      API INTERCONNECT GRAPH
    </text>

    <!-- World Grid/Nodes representation inside Card -->
    <g transform="translate(50, 160)">
      <rect width="400" height="280" rx="16" fill="#030712" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3"/>
      
      <!-- Graphic network circles -->
      <circle cx="200" cy="140" r="50" fill="none" stroke="#6366f1" stroke-width="1" opacity="0.4"/>
      <circle cx="200" cy="140" r="80" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="6 4" opacity="0.3"/>
      
      <circle cx="200" cy="140" r="10" fill="#6366f1" filter="url(#glow)"/>
      <circle cx="120" cy="90" r="6" fill="#3b82f6" filter="url(#glow)"/>
      <circle cx="280" cy="190" r="6" fill="#3b82f6" filter="url(#glow)"/>
      <circle cx="130" cy="180" r="5" fill="#818cf8"/>
      <circle cx="270" cy="80" r="5" fill="#818cf8"/>

      <line x1="200" y1="140" x2="120" y2="90" stroke="#6366f1" stroke-width="1.5" opacity="0.6"/>
      <line x1="200" y1="140" x2="280" y2="190" stroke="#6366f1" stroke-width="1.5" opacity="0.6"/>
      <line x1="200" y1="140" x2="130" y2="180" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>
      <line x1="200" y1="140" x2="270" y2="80" stroke="#3b82f6" stroke-width="1.5" opacity="0.4"/>

      <!-- Overlay text -->
      <text x="200" y="245" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#8899a6" text-anchor="middle" letter-spacing="0.05em">latency optimized routing to 48 edge locations</text>
    </g>
  </g>
</svg>
